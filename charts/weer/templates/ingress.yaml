{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weer.fullname" . }}
  labels:
    {{- include "weer.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.backend.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "weer.fullname" . }}-backend
                port:
                  name: http
          {{- end }}
{{- end }}
